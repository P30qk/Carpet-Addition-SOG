org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=false
org.gradle.daemon=false
# 共享 Gradle 家目录（/data/gradle/native）在受限沙箱里不可写，Gradle 无法在
# native 缓存里建锁文件，会报 "Failed to load native library 'libnative-platform.so'"。
# 把 native 目录指向工程内可写路径作为兜底（build/ 已被 .gitignore 忽略）。
systemProp.org.gradle.native.dir=/workspace/mod/build/gradle-native
org.gradle.java.installations.paths=/opt/jdks/java-8,/opt/jdks/java-17,/usr/lib/jvm/java-21-openjdk-amd64,/opt/jdks/java-25
minecraft_version=26.2
loom_version=1.17.20
loader_version=0.19.5
fabric_api_version=0.159.0+26.2
mod_version=1.0.0-r51
maven_group=cn.blockforge.generated
archives_base_name=sog_carpet
